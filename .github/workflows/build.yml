name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check www/index.html exists
        run: |
          if [ ! -f www/index.html ]; then
            echo "ERROR: ضع ملف الكود في المستودع بالمسار www/index.html"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SDK Packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Make jsPDF local (works offline inside the app)
        run: |
          curl -L https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#g' www/index.html
          grep -n "jspdf" www/index.html | head -3

      - name: Make zip and QR libraries local
        run: |
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o www/jszip.min.js \
            && sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#jszip.min.js#g' www/index.html \
            || echo "WARNING: jszip not downloaded, Word export needs internet"
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js -o www/qrcode.min.js \
            && sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js#qrcode.min.js#g' www/index.html \
            || echo "WARNING: qrcode not downloaded, barcode needs internet"
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js -o www/jsQR.min.js \
            && sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js#jsQR.min.js#g' www/index.html \
            || echo "WARNING: jsQR not downloaded"
          curl -fL https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js -o www/crypto-js.min.js \
            && sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js#crypto-js.min.js#g' www/index.html \
            || echo "WARNING: crypto-js not downloaded"
          grep -n "script src" www/index.html | head

      - name: Install Capacitor and plugins
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6

      - name: Add offline Arabic OCR (card data reader)
        run: |
          mkdir -p www/tesseract/lang
          npm install tesseract.js@5.1.1 tesseract.js-core@5.1.1 --no-audit --no-fund || echo "WARNING: tesseract not installed"
          cp node_modules/tesseract.js/dist/tesseract.min.js www/tesseract/ || echo "WARNING: tesseract.min.js missing"
          cp node_modules/tesseract.js/dist/worker.min.js www/tesseract/ || echo "WARNING: worker.min.js missing"
          cp node_modules/tesseract.js-core/*lstm* www/tesseract/ || echo "WARNING: tesseract core missing"
          curl -fL https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata -o www/tesseract/lang/ara.traineddata || echo "WARNING: ara data missing"
          curl -fL https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -o www/tesseract/lang/eng.traineddata || echo "WARNING: eng data missing"
          ls -la www/tesseract www/tesseract/lang

      - name: Create Android project
        run: |
          npx cap init "Mustamsakat" com.mustamsakat.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add native tools (print, folder picker) and app icon
        run: |
          PKG_DIR=android/app/src/main/java/com/mustamsakat/app
          mkdir -p "$PKG_DIR"

          cat > "$PKG_DIR/MainActivity.java" << 'EOF'
          package com.mustamsakat.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativeToolsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          cat > "$PKG_DIR/NativeToolsPlugin.java" << 'EOF'
          package com.mustamsakat.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.ParcelFileDescriptor;
          import android.print.PageRange;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintDocumentInfo;
          import android.print.PrintManager;
          import android.provider.DocumentsContract;
          import android.nfc.NdefMessage;
          import android.nfc.NdefRecord;
          import android.nfc.NfcAdapter;
          import android.nfc.Tag;
          import android.nfc.tech.IsoDep;
          import android.nfc.tech.Ndef;
          import android.nfc.tech.NfcA;
          import com.getcapacitor.JSArray;

          import androidx.activity.result.ActivityResult;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "NativeTools")
          public class NativeToolsPlugin extends Plugin {

              @PluginMethod
              public void printPdf(final PluginCall call) {
                  final String uriStr = call.getString("uri");
                  final String name = call.getString("name", "document");
                  if (uriStr == null) {
                      call.reject("missing uri");
                      return;
                  }
                  final Context ctx = getContext();
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                              pm.print(name, new PdfAdapter(ctx, Uri.parse(uriStr), name), null);
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }

              @PluginMethod
              public void pickFolder(PluginCall call) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PREFIX_URI_PERMISSION);
                  startActivityForResult(call, i, "folderResult");
              }

              @ActivityCallback
              private void folderResult(PluginCall call, ActivityResult result) {
                  if (call == null) {
                      return;
                  }
                  Intent data = result.getData();
                  if (result.getResultCode() != Activity.RESULT_OK || data == null || data.getData() == null) {
                      call.reject("cancelled");
                      return;
                  }
                  Uri tree = data.getData();
                  try {
                      getContext().getContentResolver().takePersistableUriPermission(
                              tree,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                  } catch (Exception ignored) {
                  }
                  JSObject ret = new JSObject();
                  ret.put("uri", tree.toString());
                  ret.put("name", String.valueOf(tree.getLastPathSegment()));
                  call.resolve(ret);
              }

              @PluginMethod
              public void openFile(PluginCall call) {
                  String uriStr = call.getString("uri");
                  String mime = call.getString("mime", "*/*");
                  if (uriStr == null) {
                      call.reject("missing uri");
                      return;
                  }
                  try {
                      String path = Uri.parse(uriStr).getPath();
                      File f = new File(path);
                      Uri u = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, mime);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent chooser = Intent.createChooser(i, "Open");
                      chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getActivity().startActivity(chooser);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e));
                  }
              }

              @PluginMethod
              public void saveToFolder(PluginCall call) {
                  String tree = call.getString("tree");
                  String src = call.getString("src");
                  String name = call.getString("name");
                  String mime = call.getString("mime", "application/octet-stream");
                  if (tree == null || src == null || name == null) {
                      call.reject("missing args");
                      return;
                  }
                  InputStream in = null;
                  OutputStream out = null;
                  try {
                      Uri treeUri = Uri.parse(tree);
                      Uri parent = DocumentsContract.buildDocumentUriUsingTree(
                              treeUri, DocumentsContract.getTreeDocumentId(treeUri));
                      Uri doc = DocumentsContract.createDocument(
                              getContext().getContentResolver(), parent, mime, name);
                      if (doc == null) {
                          call.reject("create failed");
                          return;
                      }
                      in = getContext().getContentResolver().openInputStream(Uri.parse(src));
                      out = getContext().getContentResolver().openOutputStream(doc);
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) {
                          out.write(buf, 0, n);
                      }
                      out.flush();
                      JSObject ret = new JSObject();
                      ret.put("uri", doc.toString());
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e));
                  } finally {
                      try {
                          if (in != null) in.close();
                      } catch (Exception ignored) {
                      }
                      try {
                          if (out != null) out.close();
                      } catch (Exception ignored) {
                      }
                  }
              }

              private NfcAdapter nfcAd;
              private IsoDep nfcIso;
              private volatile JSObject nfcInfo;
              private int nfcSeq = 0;

              private static String hex(byte[] b) {
                  if (b == null) return "";
                  StringBuilder s = new StringBuilder();
                  for (byte x : b) s.append(String.format("%02X", x));
                  return s.toString();
              }

              private static byte[] unhex(String s) {
                  int n = s.length() / 2;
                  byte[] b = new byte[n];
                  for (int i = 0; i < n; i++) {
                      b[i] = (byte) Integer.parseInt(s.substring(i * 2, i * 2 + 2), 16);
                  }
                  return b;
              }

              @PluginMethod
              public void nfcStart(final PluginCall call) {
                  try {
                      final Activity act = getActivity();
                      nfcAd = NfcAdapter.getDefaultAdapter(act);
                      if (nfcAd == null) {
                          call.reject("no_nfc");
                          return;
                      }
                      if (!nfcAd.isEnabled()) {
                          call.reject("nfc_off");
                          return;
                      }
                      nfcInfo = null;
                      final NfcAdapter.ReaderCallback cb = new NfcAdapter.ReaderCallback() {
                          @Override
                          public void onTagDiscovered(Tag tag) {
                              onNfcTag(tag);
                          }
                      };
                      final int flags = NfcAdapter.FLAG_READER_NFC_A | NfcAdapter.FLAG_READER_NFC_B
                              | NfcAdapter.FLAG_READER_NFC_F | NfcAdapter.FLAG_READER_NFC_V;
                      final Bundle ex = new Bundle();
                      ex.putInt(NfcAdapter.EXTRA_READER_PRESENCE_CHECK_DELAY, 500);
                      act.runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  nfcAd.enableReaderMode(act, cb, flags, ex);
                              } catch (Exception ignored) {
                              }
                          }
                      });
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e));
                  }
              }

              private void onNfcTag(Tag tag) {
                  JSObject o = new JSObject();
                  try {
                      try {
                          if (nfcIso != null) nfcIso.close();
                      } catch (Exception ignored) {
                      }
                      nfcIso = null;
                      o.put("uid", hex(tag.getId()));
                      JSArray techs = new JSArray();
                      for (String t : tag.getTechList()) {
                          techs.put(t.substring(t.lastIndexOf('.') + 1));
                      }
                      o.put("techs", techs);
                      NfcA a = NfcA.get(tag);
                      if (a != null) {
                          o.put("atqa", hex(a.getAtqa()));
                          o.put("sak", (int) a.getSak());
                      }
                      Ndef n = Ndef.get(tag);
                      if (n != null) {
                          try {
                              n.connect();
                              NdefMessage m = n.getNdefMessage();
                              JSArray recs = new JSArray();
                              if (m != null) {
                                  for (NdefRecord r : m.getRecords()) {
                                      JSObject ro = new JSObject();
                                      byte[] p = r.getPayload();
                                      ro.put("tnf", (int) r.getTnf());
                                      ro.put("type", new String(r.getType(), java.nio.charset.StandardCharsets.UTF_8));
                                      ro.put("hex", hex(p));
                                      String txt = null;
                                      if (r.getTnf() == NdefRecord.TNF_WELL_KNOWN
                                              && java.util.Arrays.equals(r.getType(), NdefRecord.RTD_TEXT)
                                              && p.length > 0) {
                                          int ll = p[0] & 0x3F;
                                          java.nio.charset.Charset cs = (p[0] & 0x80) != 0
                                                  ? java.nio.charset.StandardCharsets.UTF_16
                                                  : java.nio.charset.StandardCharsets.UTF_8;
                                          txt = new String(p, 1 + ll, p.length - 1 - ll, cs);
                                      } else if (r.getTnf() == NdefRecord.TNF_WELL_KNOWN
                                              && java.util.Arrays.equals(r.getType(), NdefRecord.RTD_URI)) {
                                          Uri u = r.toUri();
                                          if (u != null) txt = u.toString();
                                      } else if (r.getTnf() == NdefRecord.TNF_MIME_MEDIA) {
                                          txt = new String(p, java.nio.charset.StandardCharsets.UTF_8);
                                      }
                                      if (txt != null) ro.put("text", txt);
                                      recs.put(ro);
                                  }
                              }
                              o.put("ndef", recs);
                          } catch (Exception ignored) {
                          } finally {
                              try {
                                  n.close();
                              } catch (Exception ignored) {
                              }
                          }
                      }
                      IsoDep d = IsoDep.get(tag);
                      if (d != null) {
                          try {
                              d.connect();
                              d.setTimeout(5000);
                              nfcIso = d;
                              o.put("iso", true);
                              o.put("hist", hex(d.getHistoricalBytes()));
                              o.put("hi", hex(d.getHiLayerResponse()));
                          } catch (Exception e) {
                              o.put("iso", false);
                          }
                      }
                  } catch (Exception e) {
                      o.put("err", String.valueOf(e));
                  }
                  nfcSeq++;
                  o.put("seq", nfcSeq);
                  nfcInfo = o;
              }

              @PluginMethod
              public void nfcPoll(PluginCall call) {
                  JSObject r = nfcInfo;
                  if (r == null) {
                      JSObject e = new JSObject();
                      e.put("none", true);
                      call.resolve(e);
                  } else {
                      call.resolve(r);
                  }
              }

              @PluginMethod
              public void nfcTransceive(PluginCall call) {
                  try {
                      String h = call.getString("hex");
                      if (nfcIso == null || h == null) {
                          call.reject("no_iso");
                          return;
                      }
                      if (!nfcIso.isConnected()) nfcIso.connect();
                      byte[] r = nfcIso.transceive(unhex(h));
                      JSObject o = new JSObject();
                      o.put("hex", hex(r));
                      call.resolve(o);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e));
                  }
              }

              @PluginMethod
              public void nfcStop(final PluginCall call) {
                  try {
                      try {
                          if (nfcIso != null) nfcIso.close();
                      } catch (Exception ignored) {
                      }
                      nfcIso = null;
                      final Activity act = getActivity();
                      if (nfcAd != null) {
                          act.runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      nfcAd.disableReaderMode(act);
                                  } catch (Exception ignored) {
                                  }
                              }
                          });
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e));
                  }
              }

              private static class PdfAdapter extends PrintDocumentAdapter {
                  private final Context ctx;
                  private final Uri uri;
                  private final String name;

                  PdfAdapter(Context c, Uri u, String n) {
                      ctx = c;
                      uri = u;
                      name = n;
                  }

                  @Override
                  public void onLayout(PrintAttributes oldAttrs, PrintAttributes newAttrs,
                                       CancellationSignal signal, LayoutResultCallback callback, Bundle extras) {
                      if (signal.isCanceled()) {
                          callback.onLayoutCancelled();
                          return;
                      }
                      PrintDocumentInfo info = new PrintDocumentInfo.Builder(name)
                              .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)
                              .setPageCount(PrintDocumentInfo.PAGE_COUNT_UNKNOWN)
                              .build();
                      callback.onLayoutFinished(info, true);
                  }

                  @Override
                  public void onWrite(PageRange[] pages, ParcelFileDescriptor destination,
                                      CancellationSignal signal, WriteResultCallback callback) {
                      InputStream in = null;
                      OutputStream out = null;
                      try {
                          in = ctx.getContentResolver().openInputStream(uri);
                          out = new FileOutputStream(destination.getFileDescriptor());
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                          }
                          callback.onWriteFinished(new PageRange[]{PageRange.ALL_PAGES});
                      } catch (Exception e) {
                          callback.onWriteFailed(String.valueOf(e));
                      } finally {
                          try {
                              if (in != null) in.close();
                          } catch (Exception ignored) {
                          }
                          try {
                              if (out != null) out.close();
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/values" "$RES/mipmap-anydpi-v26"

          cat > "$RES/values/mst_colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="mst_bg">#14532D</color>
          </resources>
          EOF

          cat > "$RES/drawable/mst_fg.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M30,40L78,40L78,68L30,68Z" />
              <path android:fillColor="#D9A93A" android:pathData="M35,45L47,45L47,57L35,57Z" />
              <path android:fillColor="#1F7A4D" android:pathData="M52,46L72,46L72,49L52,49Z" />
              <path android:fillColor="#1F7A4D" android:pathData="M52,52L72,52L72,55L52,55Z" />
              <path android:fillColor="#1F7A4D" android:pathData="M35,61L72,61L72,64L35,64Z" />
          </vector>
          EOF

          for N in ic_launcher ic_launcher_round; do
          cat > "$RES/mipmap-anydpi-v26/$N.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/mst_bg" />
              <foreground android:drawable="@drawable/mst_fg" />
          </adaptive-icon>
          EOF
          done

      - name: Add camera and NFC permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.NFC" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.nfc" android:required="false" />\n    <application#' "$M"
          grep -n "uses-permission\|uses-feature" "$M"

      - name: Set Arabic app name
        run: |
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">مرتّب المستمسكات</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">مرتّب المستمسكات</string>#' android/app/src/main/res/values/strings.xml

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustamsakat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
