name: Build Android APK Stable v2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Components
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools$HOME/android-sdk/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          yes | sdkmanager --licenses || true
          sdkmanager --update || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Generate Web App & Assets
        run: |
          mkdir -p www
          curl -L https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js

          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
          <title>مرتّب المستمسكات الاحترافي</title>
          <script src="jspdf.umd.min.js"></script>
          <style>
          :root{--bg1:#f0f7f4;--bg2:#d8ece3;--ink:#0a291e;--mut:#4b7060;--pri:#0f5132;--pri2:#198754;--surf:rgba(255,255,255,.9);--bd:rgba(20,83,45,.15);--sh:0 10px 30px rgba(10,45,30,.12)}
          [data-theme="dark"]{--bg1:#06150f;--bg2:#0d281d;--ink:#e6f4ee;--mut:#8ab3a1;--pri:#198754;--pri2:#28a76c;--surf:rgba(15,42,30,.92);--bd:rgba(255,255,255,.14);--sh:0 10px 35px rgba(0,0,0,.5)}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg1),var(--bg2));overflow:hidden;user-select:none}
          button,select,input{font:inherit;color:inherit}
          button{cursor:pointer;border:0;background:none;transition:.15s}
          button:active{transform:scale(.96)}
          .app{display:flex;flex-direction:column;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          .top{display:flex;align-items:center;gap:6px;padding:10px 12px;margin:8px 10px 0;background:var(--surf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);z-index:10;flex-wrap:wrap}
          .brand{font-weight:800;font-size:15px;color:var(--pri);margin-left:auto;display:flex;align-items:center;gap:6px}
          [data-theme="dark"] .brand{color:#5cd69c}
          .pro{background:linear-gradient(135deg,#f6dd86,#d9a93a);color:#3a2b05;font-size:10px;padding:2px 6px;border-radius:6px}
          .bt{height:36px;padding:0 10px;border-radius:10px;background:rgba(25,135,84,.1);border:1px solid var(--bd);font-weight:700;font-size:12px}
          .bt.gold{background:linear-gradient(135deg,#f6dd86,#d9a93a);color:#3a2b05;border:0}
          .bt.pri{background:var(--pri);color:#fff}
          .work{flex:1;overflow:auto;padding:16px 12px 260px;display:flex;flex-direction:column;align-items:center}
          .pwrap{width:min(100%,540px);margin-bottom:20px}
          .pg{position:relative;width:100%;background:#fff;border-radius:4px;box-shadow:0 8px 25px rgba(0,0,0,.22);overflow:hidden;touch-action:pan-y}
          .pg.grid{background-image:linear-gradient(to right,rgba(0,120,60,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,60,.08) 1px,transparent 1px);background-size:5% 5%}
          .plbl{text-align:center;font-size:11px;font-weight:700;color:var(--mut);margin-top:6px}
          .slot{position:absolute;background:#f8faf9;cursor:grab;overflow:hidden;touch-action:none}
          .slot.empty{border:2px dashed #68a889;background:#f2f9f6;display:grid;place-items:center;color:#156c43;font-weight:700;font-size:12px;text-align:center;padding:6px}
          .slot.sel{outline:3px solid #198754;outline-offset:2px;z-index:4}
          .slot canvas{width:100%;height:100%;display:block;pointer-events:none}
          .hint{position:absolute;inset:0;display:grid;place-items:center;color:#729685;text-align:center;padding:20px;font-size:13px;pointer-events:none}
          .wm{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around}
          .wm span{transform:rotate(-28deg);font-weight:800;color:#000;font-size:15px;white-space:nowrap;padding:16px}
          .dock{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:15;max-width:650px;margin:0 auto;pointer-events:none}
          .dock>*{pointer-events:auto}
          .pnl{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:var(--sh);max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
          .pnl[hidden],.modal[hidden],.menu[hidden],.toast[hidden]{display:none!important}
          .row{display:flex;gap:6px;flex-wrap:wrap}
          .row>*{flex:1 1 auto}
          .cb{padding:7px 9px;border-radius:9px;background:rgba(25,135,84,.08);border:1px solid var(--bd);font-size:11.5px;font-weight:700}
          .cb.on{background:var(--pri);
