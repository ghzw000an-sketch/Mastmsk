Name: Build APK Simple

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Generate Web App & Assets
        run: |
          mkdir -p www
          curl -L https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js

          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
          <title>مرتّب المستمسكات الاحترافي</title>
          <script src="jspdf.umd.min.js"></script>
          <style>
          :root{--bg1:#f0f7f4;--bg2:#d8ece3;--ink:#0a291e;--mut:#4b7060;--pri:#0f5132;--pri2:#198754;--surf:rgba(255,255,255,.9);--bd:rgba(20,83,45,.15);--sh:0 10px 30px rgba(10,45,30,.12)}
          [data-theme="dark"]{--bg1:#06150f;--bg2:#0d281d;--ink:#e6f4ee;--mut:#8ab3a1;--pri:#198754;--pri2:#28a76c;--surf:rgba(15,42,30,.92);--bd:rgba(255,255,255,.14);--sh:0 10px 35px rgba(0,0,0,.5)}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg1),var(--bg2));overflow:hidden;user-select:none}
          button,select,input{font:inherit;color:inherit}
          button{cursor:pointer;border:0;background:none;transition:.15s}
          button:active{transform:scale(.96)}
          .app{display:flex;flex-direction:column;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          .top{display:flex;align-items:center;gap:6px;padding:10px 12px;margin:8px 10px 0;background:var(--surf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);z-index:10;flex-wrap:wrap}
          .brand{font-weight:800;font-size:15px;color:var(--pri);margin-left:auto;display:flex;align-items:center;gap:6px}
          [data-theme="dark"] .brand{color:#5cd69c}
          .pro{background:linear-gradient(135deg,#f6dd86,#d9a93a);color:#3a2b05;font-size:10px;padding:2px 6px;border-radius:6px}
          .bt{height:36px;padding:0 10px;border-radius:10px;background:rgba(25,135,84,.1);border:1px solid var(--bd);font-weight:700;font-size:12px}
          .bt.gold{background:linear-gradient(135deg,#f6dd86,#d9a93a);color:#3a2b05;border:0}
          .bt.pri{background:var(--pri);color:#fff}
          .work{flex:1;overflow:auto;padding:16px 12px 260px;display:flex;flex-direction:column;align-items:center}
          .pwrap{width:min(100%,540px);margin-bottom:20px}
          .pg{position:relative;width:100%;background:#fff;border-radius:4px;box-shadow:0 8px 25px rgba(0,0,0,.22);overflow:hidden;touch-action:pan-y}
          .pg.grid{background-image:linear-gradient(to right,rgba(0,120,60,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,60,.08) 1px,transparent 1px);background-size:5% 5%}
          .plbl{text-align:center;font-size:11px;font-weight:700;color:var(--mut);margin-top:6px}
          .slot{position:absolute;background:#f8faf9;cursor:grab;overflow:hidden;touch-action:none}
          .slot.empty{border:2px dashed #68a889;background:#f2f9f6;display:grid;place-items:center;color:#156c43;font-weight:700;font-size:12px;text-align:center;padding:6px}
          .slot.sel{outline:3px solid #198754;outline-offset:2px;z-index:4}
          .slot canvas{width:100%;height:100%;display:block;pointer-events:none}
          .hint{position:absolute;inset:0;display:grid;place-items:center;color:#729685;text-align:center;padding:20px;font-size:13px;pointer-events:none}
          .wm{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around}
          .wm span{transform:rotate(-28deg);font-weight:800;color:#000;font-size:15px;white-space:nowrap;padding:16px}
          .dock{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:15;max-width:650px;margin:0 auto;pointer-events:none}
          .dock>*{pointer-events:auto}
          .pnl{background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:var(--sh);max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
          .pnl[hidden],.modal[hidden],.menu[hidden],.toast[hidden]{display:none!important}
          .row{display:flex;gap:6px;flex-wrap:wrap}
          .row>*{flex:1 1 auto}
          .cb{padding:7px 9px;border-radius:9px;background:rgba(25,135,84,.08);border:1px solid var(--bd);font-size:11.5px;font-weight:700}
          .cb.on{background:var(--pri);color:#fff}
          .cb.del{color:#dc3545;background:rgba(220,53,69,.08)}
          select,input[type=text],input[type=number]{width:100%;padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:#fff;color:#0a291e;font-size:12.5px;font-weight:700}
          .fg{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
          .fg input[type=range]{flex:1;accent-color:var(--pri)}
          .ebar{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:6px;overflow-x:auto}
          .echip{flex:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;white-space:nowrap}
          .echip.sec{background:rgba(25,135,84,.1);color:var(--ink);border:1px solid var(--bd)}
          .echip.gold{background:linear-gradient(135deg,#f6dd86,#d9a93a);color:#3a2b05}
          .menu{position:absolute;top:56px;background:var(--bg1);border:1px solid var(--bd);border-radius:14px;padding:6px;box-shadow:var(--sh);z-index:30;display:flex;flex-direction:column;min-width:170px}
          .menu button{padding:9px 12px;text-align:right;border-radius:8px;font-weight:700;font-size:12.5px}
          .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:14px}
          .mcard{width:min(100%,420px);background:var(--bg1);border-radius:18px;padding:18px}
          .cstage{position:relative;direction:ltr;display:inline-block;touch-action:none;background:#000;border-radius:8px;overflow:hidden}
          .cstage img{display:block;max-width:100%;max-height:60vh;pointer-events:none}
          #cbox{position:absolute;border:2px solid #4ade80;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none}
          #cbox i{position:absolute;width:26px;height:26px;background:#4ade80;border-radius:50%;border:3px solid #fff}
          #cbox i[data-h=tl]{left:-13px;top:-13px}#cbox i[data-h=tr]{right:-13px;top:-13px}#cbox i[data-h=bl]{left:-13px;bottom:-13px}#cbox i[data-h=br]{right:-13px;bottom:-13px}
          .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:99;background:#0a291e;color:#fff;padding:9px 18px;border-radius:12px;font-size:12.5px;font-weight:700}
          </style>
          </head>
          <body>
          <div class="app">
            <header class="top">
              <div class="brand"><span>مرتّب المستمسكات</span><span class="pro">PRO</span></div>
              <button class="bt gold" id="bAdd">＋ إضافة مستمسك</button>
              <button class="bt" id="bPg">A4 عمودي</button>
              <button class="bt" id="bWm">🛡 حماية</button>
              <button class="bt" id="bArr">ترتيب</button>
              <button class="bt" id="bGrd">شبكة</button>
              <button class="bt" id="bThm">☾</button>
            </header>
            <div class="menu" id="mAdd" hidden style="right:110px">
              <button id="aTwo">بطاقة / هوية (وجه وظهر)</button>
              <button id="aOne">وثيقة / مستند (وجه واحد)</button>
            </div>
            <div class="menu" id="mPg" hidden style="right:200px"></div>
            <div class="work" id="pages"></div>
            <div class="dock">
              <div class="pnl" id="insp" hidden>
                <div class="row" style="justify-content:space-between;align-items:center">
                  <b id="iTitle" style="font-size:13px">خصائص المستمسك</b>
                  <div style="display:flex;gap:4px">
